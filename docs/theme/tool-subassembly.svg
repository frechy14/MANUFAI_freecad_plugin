</style><title id="title">SubAssembly</title><desc id="description">SubAssembly Create and organize manufacturing SubAssemblies. Allows the user to divide complex CAD assemblies into logical manufacturing SubAssemblies, providing a structured organization of the components involved in the welding process. Visual Part Grouping: Organizes CAD parts into logical manufacturing SubAssemblies. Tree Organization: Creates a clear manufacturing hierarchy inside the FreeCAD tree. CAD Preservation: Organizes the parts without modifying the original CAD constraints.</desc>
