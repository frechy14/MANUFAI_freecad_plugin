          class="heading"
          x="149" y="57"
          font-size="29" font-weight="700">
      <tspan x="149" y="57">Weld Creators</tspan>
    </text>

    <text id="subtitulo"
          inkscape:label="Subtitle"
          class="subtitle"
          x="149" y="90"
          font-size="20">
      <tspan x="149" y="90">Trajectory Generation</tspan>
    </text>

    <text id="descripcion"
          inkscape:label="Description"
          class="body"
          x="45" y="163"
          font-size="22">
      <tspan x="45" y="163">This module converts part edges or potentially weldable edges identified in the</tspan>
      <tspan x="45" y="197">previous module into welding trajectories. It provides several methods for</tspan>
