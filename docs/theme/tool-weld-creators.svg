<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="1120" height="281" viewBox="0 0 1120 281"
     role="img" aria-labelledby="title description">

  <title id="title">Weld Creators</title>
  <desc id="description">This module converts part edges or potentially weldable edges identified in the previous module into welding trajectories. It provides several methods for creating welds.</desc>

  <style>
    .background-start { stop-color: #FFFFFF; }
    .background-end { stop-color: #F5F8FC; }
    .panel { stroke: #C7D4E3; stroke-opacity: 1; }
    .header { fill: #EDF4FD; fill-opacity: 1; }
    .icon-background {
      fill: #E2EEFC;
      fill-opacity: 1;
      stroke: #BED2E9;
      stroke-opacity: 1;
    }
    .divider { stroke: #D3DFED; stroke-opacity: 1; }
    .heading { fill: #172B49; }
    .subtitle { fill: #526982; }
    .body { fill: #40536B; }

    @media (prefers-color-scheme: dark) {
      .background-start { stop-color: #0A0E17; }
      .background-end { stop-color: #142133; }
      .panel { stroke: #365171; stroke-opacity: .8; }
      .header { fill: #182A44; fill-opacity: .38; }
      .icon-background {
        fill: #1E88E5;
        fill-opacity: .13;
        stroke: #64B5F6;
        stroke-opacity: .22;
      }
      .divider { stroke: #7CA3D2; stroke-opacity: .16; }
      .heading { fill: #E8F0FE; }
      .subtitle { fill: #8FAFD3; }
      .body { fill: #C0D0E4; }
    }
  </style>

