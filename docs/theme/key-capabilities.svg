</style><title id="title">Key capabilities</title><desc id="description">Key capabilities  Intelligent Geometry Analysis: Analyzes the 3D model geometry to identify edges and potentially weldable regions, including T-joints, 90° joints, and other relevant configurations. Weld Path Generation: Allows users to generate and configure welding trajectories from the selected geometry, including continuous welds, edge offsets, and intermittent welds. Welding Orientation Definition: Calculates and assigns normal vectors and orientations along the welding trajectories, providing the information required to correctly define the position and orientation of the welding torch. Process Parameter Management: Allows technological information and welding process parameters to be assigned, such as speeds, materials, preparation data, resources, and other information required for subsequent calculations and simulations. Process Simulation &amp; Sequencing: Facilitates the definition of the welding execution order and allows operations performed by robots, human operators, or auxiliary equipment to be organized, supporting process analysis and cycle-time calculations. Robotic Workflow Integration: Prepares welding trajectories and orientation information for use in external robotic simulation and programming tools, such as RoboDK. Manufacturing Data Organization: Structures project information within FreeCAD, facilitating the organization of welds, positions, resources, and manufacturing operations. Engineering Reports: Generates useful information for project documentation and analysis, including welding length, operation times, process parameters, and manufacturing-related estimates.</desc>
