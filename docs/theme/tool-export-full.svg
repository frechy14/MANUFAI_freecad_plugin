</style><title id="title">Export to RoboDK</title>
<desc id="description">Export to RoboDK Export the complete assembly or selected components Transfers geometry from the FreeCAD model to RoboDK to prepare robotic simulation. Two export modes are available: Full assembly: transfers all visible components of the current assembly. Selected components: transfers only the parts selected in FreeCAD.</desc>

