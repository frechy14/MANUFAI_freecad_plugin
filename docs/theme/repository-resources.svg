</style><title id="title">Repository structure &amp; test resources</title><desc id="description">Repository structure &amp; test resources  To ensure you can replicate the workflows shown in the demonstrations, each tool/button has its own dedicated folder in this repository. Inside each tool's folder, you will find the following organized resources: Tool Icon: The image file of the button for easy visual identification. 📂 01 Files needed to test: Contains the exact input files (CAD models, scripts, etc.) required to perform the test shown in the video. 📂 02 Output: Contains the final result generated by the tool (exported files, reports, or modified geometry), serving as a reference to verify that the tool executed correctly.</desc>
