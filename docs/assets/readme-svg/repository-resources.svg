<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="441" viewBox="0 0 1120 441" role="img" aria-labelledby="title description">
<title id="title">Repository structure &amp; test resources</title><desc id="description">Repository structure &amp; test resources  To ensure you can replicate the workflows shown in the demonstrations, each tool/button has its own dedicated folder in this repository. Inside each tool&#x27;s folder, you will find the following organized resources: Tool Icon: The image file of the button for easy visual identification. 📂 01 Files needed to test: Contains the exact input files (CAD models, scripts, etc.) required to perform the test shown in the video. 📂 02 Output: Contains the final result generated by the tool (exported files, reports, or modified geometry), serving as a reference to verify that the tool executed correctly.</desc>
