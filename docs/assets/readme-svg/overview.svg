<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="412" viewBox="0 0 1120 412" role="img" aria-labelledby="title description">
<title id="title">Welding engineering &amp; simulation</title><desc id="description">Welding engineering &amp; simulation  MANUFAI is a specialized workbench for FreeCAD, developed to integrate 3D CAD design with the planning, preparation, and simulation of welding processes. Its main objective is to transform CAD geometry into usable manufacturing information, enabling users to define welding trajectories, tool orientations, process parameters, operation sequences, and the data required for subsequent simulations, all within the same working environment. The plugin is designed to facilitate the transition between digital design and manufacturing process execution, reducing manual tasks and centralizing the information associated with the welding process.</desc>
