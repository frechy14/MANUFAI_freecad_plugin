<title id="title">Datum B</title>
<desc id="description">Datum B Define the secondary direction of the coordinate system. Establishes the directional reference used after Datum A to further constrain and orient the model. Secondary Constraint: Locks 2 additional degrees of freedom. Directional Definition: Can use edges, faces, or calculated theoretical midplanes.</desc>

