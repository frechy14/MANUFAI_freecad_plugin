<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="383" viewBox="0 0 1120 383" role="img" aria-labelledby="title description">
<title id="title">Download &amp; installation</title><desc id="description">Download &amp; installation  Download. Get the .exe installer from MANUFAI – FreeCAD Plugin. Install. Run the executable and follow the setup wizard. If prompted by Windows SmartScreen, click “Run anyway.” The installer automatically locates your FreeCAD Mod directory. Restart FreeCAD. The MANUFAI workbench will be available in the workbench selector. Required FreeCAD version: 1.1.1. Watch installation tutorial · Sign up and download FreeCAD Plugin</desc>
<defs><linearGradient id="panel-bg" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5F8FC"/></linearGradient></defs>
<rect x=".7" y=".7" width="1118.6" height="381.6" rx="18" fill="url(#panel-bg)" stroke="#C7D4E3" stroke-opacity="1"/>
<path d="M20 1H1100Q1119 1 1119 20V95H1V20Q1 1 20 1" fill="#EDF4FD" fill-opacity="1"/>
<path d="M1 95H1119" stroke="#D3DFED" stroke-opacity="1"/>
