<title id="title">Plugin Component Manager</title><desc id="description">Plugin Component Manager  ModifierOpen the Plugin Component Manager to choose which toolbars and features are displayed. Click the Modifier button in the MANUFAI toolbar. The Plugin Component Manager setup window opens. Check or uncheck the components you want to show or hide. Click Install to save the changes, then restart FreeCAD. MANUFAI Workbench — required; cannot be disabled. 3-2-1 Datum Based Alignment Tools. C3P – WdCurve Tools. RoboDK &amp; Process Automation.</desc>
