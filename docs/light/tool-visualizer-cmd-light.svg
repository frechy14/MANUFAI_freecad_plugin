ca, sans-serif" font-size="22" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start">Workstation Positions, and individual Robots. Combined with an integrated lightweight sphere rendering</tspan><tspan x="45" y="275" fill="#40536B" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start">mode, it allows engineers to inspect weld coverage and cell accessibility instantly without performance</tspan><tspan x="45" y="309" fill="#40536B" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" font-style="normal" letter-spacing="0" text-anchor="start">lag.</tspan></text></svg>