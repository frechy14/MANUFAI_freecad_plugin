<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="403" viewBox="0 0 1120 403" role="img" aria-labelledby="title description">
<title id="title">Line Weld Table</title><desc id="description">Line Weld Table Parameter Editor &amp; WDCurve Exporter Provides a comprehensive tabular interface to audit and refine technical data for all weld lines within the document. This is the final stage of the workflow. Bulk Editing: Batch modify Voltage (U), Current (I), Speed (V), and Sequence parameters. Sequence Management: Reorder the welding sequence via drag-and-drop. Parallel Operations: Define simultaneous tasks for multi-robot synchronization. Final Export: Generates the .WDCurve file, exporting only active layers for external processing.</desc>
<defs><linearGradient id="panel-bg" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5F8FC"/></linearGradient></defs>
