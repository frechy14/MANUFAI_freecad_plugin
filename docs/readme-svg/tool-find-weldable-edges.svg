<title id="title">Find Weldable Edges</title><desc id="description">Find Weldable Edges Weldable Union Recognition &amp; Filtering This tool automatically identifies and extracts edges that are viable candidates for welding. It analyzes the faces and bounding boxes of the 3D model to detect structural joints, filtering out unneeded geometry based on user-defined length and distance thresholds. Smart Detection: Analyzes complex geometry to distinguish between actual structural joints and regular aesthetic CAD edges. Length Filtering: Automatically ignores edges that are shorter than your specified minimum length, preventing the processing of insignificant details. Automated Output: Generates a clean "Weldedges" object ready for path generation, hiding the original selection to keep your viewport clear.</desc>
