<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="393" viewBox="0 0 1120 393" role="img" aria-labelledby="title description">
<title id="title">Assign Process</title><desc id="description">Assign Process Assign process information to welding trajectories. Links the previously defined process parameters to the corresponding weld lines before the welding sequence is analyzed. Process Data Linking: Connects previously created process parameters with the selected welding trajectories. Project Data: Ensures that each weld contains the necessary process information for later cycle-time calculations, simulation, or report generation.</desc>
