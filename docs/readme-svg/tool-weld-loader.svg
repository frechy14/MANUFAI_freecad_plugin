<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="539" viewBox="0 0 1120 539" role="img" aria-labelledby="title description">
<title id="title">Weld Loader</title><desc id="description">Weld Loader Advanced Welding Data Importer &amp; Interoperability A robust synchronization tool designed to bridge external welding design software with FreeCAD. It specializes in parsing industry-standard trajectory files while preserving critical manufacturing parameters. Multi-Format Support: Native parsing of .WDCurve and .cwsf (CastWorks) files, including global heat source parameters like Voltage (U) and Current (I). WSO: Accepts .dkproj files containing the sequence created by WSO. Smart Geometry Reconstruction: Automatically cleans duplicate coordinate points, detects closed curves, and reconstructs valid 3D wires for simulation. Manufacturing Metadata: Imports and assigns complete process metadata including sequence numbers, layer organization, welding speed, efficiency, and automated lead time calculations.</desc>
