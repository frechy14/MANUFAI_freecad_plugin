<title id="title">Create Materials</title><desc id="description">Create Materials Create custom materials for weight calculations. Allows the user to create and define materials by specifying the properties required for subsequent weight calculations. Material Definition:Creates new materials with their corresponding density. Custom Database:Allows project-specific materials to be added for later use.</desc>
