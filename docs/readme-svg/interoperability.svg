<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="704" viewBox="0 0 1120 704" role="img" aria-labelledby="title description">
<title id="title">Interoperability: from CAD to manufacturing</title><desc id="description">Interoperability: from CAD to manufacturing  MANUFAI is designed to integrate FreeCAD into a broader manufacturing workflow, facilitating the connection between CAD design, process preparation, simulation, and manufacturing programming. The plugin acts as a bridge between the information generated in FreeCAD and specialized simulation, robotics, and analysis tools, enabling the transfer of welding trajectories, orientations, and process data to external platforms used in industrial environments. Integration with Specialized Software: Facilitates connectivity with tools such as RoboDK, C3P, and other simulation and computational environments. Manufacturing Data Transfer: Enables the export of welding trajectories and process parameters for subsequent stages of simulation, programming, or validation. Pre-Manufacturing Validation: Helps evaluate aspects such as trajectory, orientation, kinematics, and process behavior before physical implementation. Digital Workflow Continuity: Maintains a structured connection between the CAD model and the subsequent stages of engineering and manufacturing. In this way, MANUFAI allows FreeCAD to function not only as a design tool, but also as a starting point for the planning, simulation, and digital preparation of welding processes.</desc>
<defs><linearGradient id="panel-bg" x2="1" y2="1"><stop stop-color="#0A0E17"/><stop offset="1" stop-color="#142133"/></linearGradient></defs>
<rect x=".7" y=".7" width="1118.6" height="702.6" rx="18" fill="url(#panel-bg)" stroke="#365171" stroke-opacity=".8"/>
