<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="441" viewBox="0 0 1120 441" role="img" aria-labelledby="title description">
<title id="title">Repository structure &amp; test resources</title><desc id="description">Repository structure &amp; test resources  To ensure you can replicate the workflows shown in the demonstrations, each tool/button has its own dedicated folder in this repository. Inside each tool's folder, you will find the following organized resources: Tool Icon: The image file of the button for easy visual identification. 📂 01 Files needed to test: Contains the exact input files (CAD models, scripts, etc.) required to perform the test shown in the video. 📂 02 Output: Contains the final result generated by the tool (exported files, reports, or modified geometry), serving as a reference to verify that the tool executed correctly.</desc>
<defs><linearGradient id="panel-bg" x2="1" y2="1"><stop stop-color="#0A0E17"/><stop offset="1" stop-color="#142133"/></linearGradient></defs>
<rect x=".7" y=".7" width="1118.6" height="439.6" rx="18" fill="url(#panel-bg)" stroke="#365171" stroke-opacity=".8"/>
<path d="M20 1H1100Q1119 1 1119 20V95H1V20Q1 1 20 1" fill="#182A44" fill-opacity=".38"/>
<path d="M1 95H1119" stroke="#7CA3D2" stroke-opacity=".16"/>
