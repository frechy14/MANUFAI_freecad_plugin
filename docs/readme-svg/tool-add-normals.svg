<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="471" viewBox="0 0 1120 471" role="img" aria-labelledby="title description">
<title id="title">Add Normals</title><desc id="description">Add Normals Create and define orientation normals along the welding path Generates normal vectors along the selected weld trajectory in FreeCAD, allowing the user to define the orientation required for later robotic welding simulation and offline programming in RoboDK. Normal Generation: Creates normal vectors along the weld path based on the selected geometry. Tool Orientation: Defines the approach direction and orientation that the welding torch should follow. Trajectory Preparation: Prepares the weld path with the orientation information required for robotic simulation. RoboDK Integration: Provides the directional data needed to correctly transfer and simulate the welding trajectory in RoboDK.</desc>
