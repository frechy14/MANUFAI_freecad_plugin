<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="359" viewBox="0 0 1120 359" role="img" aria-labelledby="title description">
<title id="title">Assign Welding Parameters</title><desc id="description">Assign Welding Parameters Assign heat-source data to individual weld lines. Associates the appropriate heat-source configuration with each welding trajectory so that the project contains all required process information. Parameter Assignment: Applies the selected welding parameters to one or more weld trajectories. Weld Data Validation: Ensures that the welds contain the required information for later cycle-time calculations, simulation, and report generation.</desc>
<defs><linearGradient id="panel-bg" x2="1" y2="1"><stop stop-color="#0A0E17"/><stop offset="1" stop-color="#142133"/></linearGradient></defs>
<rect x=".7" y=".7" width="1118.6" height="357.6" rx="18" fill="url(#panel-bg)" stroke="#365171" stroke-opacity=".8"/>
<path d="M20 1H1100Q1119 1 1119 20V120H1V20Q1 1 20 1" fill="#182A44" fill-opacity=".38"/>
<rect x="1021" y="30" width="57" height="38" rx="9" fill="#1E88E5" fill-opacity=".14" stroke="#64B5F6" stroke-opacity=".2"/>
<rect x="39" y="30" width="78" height="78" rx="15" fill="#1E88E5" fill-opacity=".13" stroke="#64B5F6" stroke-opacity=".22"/>

<path d="M1 120H1119" stroke="#7CA3D2" stroke-opacity=".16"/>
