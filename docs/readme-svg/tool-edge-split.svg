<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="427" viewBox="0 0 1120 427" role="img" aria-labelledby="title description">
<title id="title">Edge Split</title><desc id="description">Edge Split Geometric Extraction &amp; Intersection This tool automatically scans the 3D model (or specific selected parts) to extract all solid edges. It brings them into a global coordinate system and splits the intersecting lines based on a user-defined tolerance threshold. Automated Cleanup: Generates a clean object with the split edges and automatically hides the original solid bodies to keep the workspace clear. Assembly Aware: Respects the global position of parts nested inside complex assemblies or linked objects.</desc>
