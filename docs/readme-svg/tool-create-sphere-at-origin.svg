<title id="title">Create Sphere at Origin</title><desc id="description">Create Sphere at Origin Generates a visual reference at the Global Origin (0,0,0). It places a reference sphere at the absolute zero of the workspace. This provides an immediate visual check to determine the offset distance of imported models relative to the workspace center before starting any alignment procedures.</desc>
