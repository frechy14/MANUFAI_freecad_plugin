<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="398" viewBox="0 0 1120 398" role="img" aria-labelledby="title description">
<title id="title">Assign Sequence</title><desc id="description">Assign Sequence Define the execution order of the welding process. Allows the user to organize workstations, robots, and weld trajectories into a logical execution sequence before running the welding simulation. Execution Order: Defines the order in which the welding operations will be performed. Process Organization: Structures Positions, Robots, and Welds according to the manufacturing plan. Simulation Preparation: Creates the sequence required before the robotic welding simulation is executed.</desc>
<defs><linearGradient id="panel-bg" x2="1" y2="1"><stop stop-color="#0A0E17"/><stop offset="1" stop-color="#142133"/></linearGradient></defs>
<rect x=".7" y=".7" width="1118.6" height="396.6" rx="18" fill="url(#panel-bg)" stroke="#365171" stroke-opacity=".8"/>
