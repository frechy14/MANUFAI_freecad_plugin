<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="393" viewBox="0 0 1120 393" role="img" aria-labelledby="title description">
<title id="title">Glue Manager</title><desc id="description">Glue Manager Weld-to-Dispensing Path Conversion. This tool repurposes existing MANUFAI weld paths (Pts data) to create precise adhesive dispensing trajectories. Non-Destructive Transformation: Includes a dedicated panel to Scale, Translate, and Rotate the path locally without altering the original CAD geometry. Smart Export: Automatically calculates surface normals for correct gun orientation and exports the transformed data to RoboDK as a "Curve Follow Project".</desc>
