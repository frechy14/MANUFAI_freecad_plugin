<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="432" viewBox="0 0 1120 432" role="img" aria-labelledby="title description">
<title id="title">Reset Position</title><desc id="description">Reset Position Toggle transformation reset and coordinate zeroing A professional utility command designed to quickly clear or restore the transformation matrix (Placement) of selected CAD objects with native "Undo" support. Smart Toggle Logic: If the object is currently placed away from the workspace, clicking the button saves its current position to a hidden property and instantly resets its placement to the absolute origin (0,0,0). If the object is already at the origin, clicking it again automatically restores its previous saved position.</desc>
