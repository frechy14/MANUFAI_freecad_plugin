<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="617" viewBox="0 0 1120 617" role="img" aria-labelledby="title description">
<title id="title">Discretize</title><desc id="description">Discretize Geometry-Aware Path Projection. A high-precision tool that refines welding trajectories by projecting existing data onto target CAD edges. It eliminates the "floating path" issue by snapping the simulation points directly to the physical geometry. Adaptive Point Density: Unlike standard discretization, this tool distinguishes between geometries: Curved Edges: Applies the user-defined Curve Density for smooth robotic motion. Straight Edges: Automatically optimizes to just 2 points (Start/End), reducing redundant controller data and OLP complexity. Multi-Edge Selection: Capable of projecting a single weld trajectory across multiple disparate edges (Compound support). Real-Time Optimization: Includes a "Corner Detection" logic that preserves points only where direction changes significantly ($cos( heta) &lt; 0.9999$). Automatic Sync: Updates all internal MANUFAI metrics (Distance, Pts, and LeadTime) immediately after projection.</desc>
<defs><linearGradient id="panel-bg" x2="1" y2="1"><stop stop-color="#0A0E17"/><stop offset="1" stop-color="#142133"/></linearGradient></defs>
