<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="393" viewBox="0 0 1120 393" role="img" aria-labelledby="title description">
<title id="title">Show Weld Sphere</title><desc id="description">Show Weld Sphere Lightweight 3D visual verification and playback sequence control. Designed for rapid visual verification of welds without the computational overhead of generating complex geometric solids. It utilizes direct scene graph rendering to project a customizable &quot;cloud&quot; of spheres along the trajectory, providing an immediate visual representation of weld coverage while maintaining a lightweight model size and fluid viewport navigation. It includes an integrated sequence table and playback controls to inspect your production flow row by row.</desc>
