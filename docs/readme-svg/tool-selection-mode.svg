<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="359" viewBox="0 0 1120 359" role="img" aria-labelledby="title description">
<title id="title">Selection Mode (X-Ray &amp; Filter)</title><desc id="description">Selection Mode (X-Ray &amp; Filter) Visual isolation and Selection Lock. A specialized view mode designed for working in complex assemblies. X-Ray Vision: Makes the 3D geometry transparent while keeping weld lines solid and visible. Click-Through Blocker: Selection Filter. Strictly blocks the selection of 3D geometry (faces/bodies), ensuring that clicks only register on weld lines. This prevents accidental selection of the background model.</desc>
