<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="364" viewBox="0 0 1120 364" role="img" aria-labelledby="title description">
<title id="title">SubAssembly</title><desc id="description">SubAssembly Create and organize manufacturing SubAssemblies. Allows the user to divide complex CAD assemblies into logical manufacturing SubAssemblies, providing a structured organization of the components involved in the welding process. Visual Part Grouping: Organizes CAD parts into logical manufacturing SubAssemblies. Tree Organization: Creates a clear manufacturing hierarchy inside the FreeCAD tree. CAD Preservation: Organizes the parts without modifying the original CAD constraints.</desc>
