<title id="title">Datum C</title><desc id="description">Datum C Define the final reference required for positioning. Establishes the final reference point of the 3-2-1 system and completes the constraint of the model. Final Constraint: Locks the last remaining degree of freedom. Zero Point Definition: Can use vertices, sphere centers, or edge midpoints.</desc>
