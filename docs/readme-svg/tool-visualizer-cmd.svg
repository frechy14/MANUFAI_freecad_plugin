<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="359" viewBox="0 0 1120 359" role="img" aria-labelledby="title description">
<title id="title">Visualizer</title><desc id="description">Visualizer Interactive 3D visibility control and rapid weld inspection. Designed to easily isolate and audit complex multi-robot manufacturing cells. It provides a structured tree-based interface to selectively toggle the visibility of SubAssemblies, Workstation Positions, and individual Robots. Combined with an integrated lightweight sphere rendering mode, it allows engineers to inspect weld coverage and cell accessibility instantly without performance lag.</desc>
