<title id="title">Create Center Point</title><desc id="description">Create Center Point Calculates geometric centers for quick referencing. It computes and marks the center point based on the current selection. Single Object: Marks the center of mass/geometry. Two Objects: Calculates the exact midpoint between them. Useful for establishing auxiliary reference points on complex geometry without creating full datums.</desc>
