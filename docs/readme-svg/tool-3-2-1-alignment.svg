<title id="title">3-2-1 Datum-Based Alignment</title><desc id="description">3-2-1 Datum-Based Alignment This suite provides a step-by-step workflow to establish a definitive coordinate system (CSYS) using standard 3-2-1 alignment logic. It guides you from reference identification to assembly-safe model repositioning Uses Datum A, Datum B, and Datum C to establish a definitive coordinate system based on standard 3-2-1 alignment principles. Reference Combination: Combines the three selected datum references. Coordinate System Definition: Determines the orientation and origin required to correctly reposition the model.</desc>
