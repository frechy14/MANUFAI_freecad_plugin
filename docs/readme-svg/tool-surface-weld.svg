<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title description">
<title id="title">Surface Weld</title><desc id="description">Surface Weld Volumetric modeling and physical joint representation Designed for visual validation and mechanical documentation. Unlike trajectory modules that generate invisible paths for robots, this tool generates the actual solid geometry representing Fillet, Butt, and Complex Curve welds. This is essential for collision detection, mass calculation, and rendering. Edge Weld (Auto-Detect): Automatically detects the geometric type of the edge (Straight, Arc, BSpline, etc.) and generates a solid weld bead between two intersecting faces. It uses an advanced parallel transport algorithm to prevent the 3D shape from twisting along complex curves. Butt Weld (Angular): Generates an extruded arc shape to accurately represent V-groove and butt welding joints between two planar faces. WeldLine Constructor: A built-in freehand polyline tool to manually draw 3D weld.</desc>
