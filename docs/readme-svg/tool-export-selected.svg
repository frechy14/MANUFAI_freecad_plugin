<title id="title">Export Selected</title><desc id="description">Export Selected Transfer only selected CAD components to RoboDK. Exports only the parts selected by the user in FreeCAD, allowing specific components to be transferred to RoboDK without exporting the complete assembly. Selective Export: Transfers only the components selected in the FreeCAD model. Partial Updates: Useful when only specific parts need to be added or updated in the RoboDK station. Isolated Testing: Allows individual components or groups of parts to be evaluated without transferring the complete assembly.</desc>
