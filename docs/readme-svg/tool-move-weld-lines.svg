<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title description">
<title id="title">Move Weld Lines</title><desc id="description">Move Weld Lines Precision Trajectory Re-positioning. A multi-modal suite designed to reposition welding paths without losing their internal manufacturing data. It provides three specialized workflows to handle any alignment scenario: Smart Projection: Aligns the entire weld line to a target edge by calculating the shortest distance to the path&#x27;s center, ensuring perfect surface contact while preserving the original shape. Circular Alignment: Specialized for pipes and bosses. It detects circular/arc edges and snaps one or multiple weld lines to them using the first point as a precise anchor. Manual Transformer: A real-time editing panel for fine-tuning. Rotate and translate paths using precision spinboxes (X, Y, Z, Rx, Ry, Rz) with automatic recalculation of lead times and distances.</desc>
